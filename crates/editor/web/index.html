<!doctype html>
<html data-theme="dark" lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>MarkForge</title>
<link id="hljs-css" rel="stylesheet" href="/assets/github-dark.min.css">
<link rel="stylesheet" href="/assets/markdown.css">
<link rel="stylesheet" href="/app.css">
<script src="/assets/highlight.min.js"></script>
<script src="/assets/mermaid.min.js"></script>
<script src="/assets/preview.js"></script>
<script src="/vendor/codemirror.js"></script>
<script src="/icons.js"></script>
</head>
<body>
<div id="toolbar" role="toolbar"></div>
<div id="main">
  <div id="editor-pane"></div>
  <div id="splitter" title="拖曳調整寬度"></div>
  <div id="preview-pane"><article id="preview" class="markdown-body"></article></div>
</div>
<div id="statusbar">
  <span id="st-path"></span>
  <span id="st-count"></span>
  <span id="st-pos"></span>
</div>
<div id="popup" hidden></div>
<div id="modal-backdrop" hidden><div id="modal" role="dialog"></div></div>
<script src="/app.js"></script>
</body>
</html>
